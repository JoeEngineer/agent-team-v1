# Security scan template from the agent-team plugin. Optional: team-init copies
# it into .github/workflows/ only when you say yes.
# Trivy scans the working tree (not git history) for vulnerabilities,
# misconfiguration and secrets at HIGH and CRITICAL. Read-only: results stay in the job log.
# After the first run, add the job names below to your required checks.
# On pull requests the four Trivy config and ignore files (trivy.yaml, .trivyignore,
# .trivyignore.yaml, trivy-secret.yaml) are taken from the base branch, so a PR's
# change to them applies only after it merges. Other files a base trivy.yaml names
# are still read from the PR tree. A PR can still weaken its scan by editing this
# workflow, with inline trivy:ignore comments, or by removing or moving the root
# Dockerfile (trivy-image is then skipped, which does not block a merge). Review
# PR changes to those.
# With no Dockerfile at the repo root, trivy-image shows as skipped, not passed.
name: security-scan

on:
  pull_request:
  push:
    branches:
      - main
      - 'milestone/**'

permissions:
  contents: read

jobs:
  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A PR must not change these four files for its own scan: use the base
      # branch's copy of each, or none if the base has none. The base commit comes
      # from a second checkout (no token kept, so it also works on private repos),
      # inside the workspace because checkout requires that. It is deleted before
      # Trivy so it is never scanned. The SHA is only ever in with:, never inline
      # in a run: script. A PR that ships its own .scan-base (a symlink to . would
      # make the second checkout replace the PR tree) fails the job first.
      - name: Refuse a .scan-base from the PR
        if: github.event_name == 'pull_request'
        run: |
          if [ -e .scan-base ] || [ -L .scan-base ]; then
            echo "::error::.scan-base exists in the PR tree; the base config checkout needs that path. Remove it from the PR."
            exit 1
          fi
      - name: Check out base branch config
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .scan-base
          persist-credentials: false
      - name: Use base-branch scanner config
        if: github.event_name == 'pull_request'
        run: |
          for f in trivy.yaml .trivyignore .trivyignore.yaml trivy-secret.yaml; do
            rm -f "$f"
            if [ -f ".scan-base/$f" ]; then cp ".scan-base/$f" "$f"; fi
          done
          rm -rf .scan-base
      - name: Trivy file system scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

  detect-dockerfile:
    name: detect-dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      found: ${{ steps.dockerfile.outputs.found }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only a Dockerfile at the repo root is detected.
      - name: Look for a Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

  trivy-image:
    name: trivy-image
    needs: detect-dockerfile
    if: needs.detect-dockerfile.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse a .scan-base from the PR
        if: github.event_name == 'pull_request'
        run: |
          if [ -e .scan-base ] || [ -L .scan-base ]; then
            echo "::error::.scan-base exists in the PR tree; the base config checkout needs that path. Remove it from the PR."
            exit 1
          fi
      - name: Check out base branch config
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .scan-base
          persist-credentials: false
      - name: Use base-branch scanner config
        if: github.event_name == 'pull_request'
        run: |
          for f in trivy.yaml .trivyignore .trivyignore.yaml trivy-secret.yaml; do
            rm -f "$f"
            if [ -f ".scan-base/$f" ]; then cp ".scan-base/$f" "$f"; fi
          done
          rm -rf .scan-base
      - name: Build image
        run: docker build -t scan-target:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: scan-target:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
